name: Moto G200 REACH-14 AOSP QEMU ARM64 Binder KASAN basic smoke tests
on:
  workflow_dispatch:
  push:
    branches: [reach14-20261021]
    paths:
      - .github/workflows/arm64-reach14.yml
      - scripts/run-reach14.sh
      - scripts/reach14_binder_patch.py
      - initramfs/reach14_init.c
      - tests/test_reach14.py
permissions:
  contents: read
concurrency:
  group: reach14-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qemu-binder:
    name: Binder KASAN - ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [unpatched, corrected]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    env:
      REACH14_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout only public files
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Public-only preflight
        run: bash scripts/preflight.sh
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends bc bison flex build-essential gcc-12 libelf-dev libssl-dev cpio gzip git make qemu-system-arm python3
      - name: Run local tests
        run: bash scripts/verify-local.sh
      - name: Run virtual ARM64 Binder comparison
        run: bash scripts/run-reach14.sh
      - name: Upload textual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reach14-${{ matrix.variant }}-evidencias
          path: reports/
          if-no-files-found: warn
          retention-days: 7
