name: REACH-20A QEMU ARM64 KASAN baseline
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/reach20a-qemu-kasan.yml
permissions:
  contents: read
jobs:
  qemu-kasan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Install build and virtualization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git make gcc bc bison flex libssl-dev libelf-dev libncurses-dev qemu-system-arm qemu-system-data ipxe-qemu busybox-static cpio gzip
          uname -m
          test "$(uname -m)" = aarch64
          qemu-system-aarch64 --version
          dpkg-query -W qemu-system-arm qemu-system-data ipxe-qemu
          test -s /usr/lib/ipxe/qemu/efi-virtio.rom
          echo 'EFI virtio ROM package verified; headless direct-kernel boot does not need network option ROM'
      - name: Fetch public reference Linux kernel
        run: |
          git clone --depth 1 --branch v6.6.100 https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git linux
      - name: Configure reference kernel with KASAN
        run: |
          cd linux
          make ARCH=arm64 defconfig
          scripts/config --enable KASAN --enable KASAN_GENERIC --enable KASAN_INLINE --enable IKCONFIG --enable IKCONFIG_PROC --enable DEVTMPFS --enable DEVTMPFS_MOUNT
          make ARCH=arm64 olddefconfig
          grep -E '^CONFIG_(KASAN|KASAN_GENERIC|IKCONFIG_PROC)=' .config
          grep -qx 'CONFIG_KASAN=y' .config
          grep -qx 'CONFIG_KASAN_GENERIC=y' .config
      - name: Build ARM64 reference kernel
        run: |
          make -C linux ARCH=arm64 -j2 Image
          test -s linux/arch/arm64/boot/Image
      - name: Create minimal read-only validation initramfs
        run: |
          mkdir -p initramfs/bin initramfs/proc initramfs/sys initramfs/dev
          cp /bin/busybox initramfs/bin/busybox
          ln -s busybox initramfs/bin/sh
          cat > initramfs/init <<'EOF'
          #!/bin/sh
          /bin/busybox mount -t proc proc /proc
          /bin/busybox mount -t sysfs sysfs /sys
          echo REACH20A_GUEST_STARTED
          if /bin/busybox zcat /proc/config.gz | /bin/busybox grep -qx 'CONFIG_KASAN=y'; then
            echo REACH20A_KASAN_CONFIG_PASS
          else
            echo REACH20A_KASAN_CONFIG_FAIL
          fi
          /bin/busybox poweroff -f
          EOF
          chmod +x initramfs/init
          (cd initramfs && find . -print0 | cpio --null -ov --format=newc 2>/dev/null | gzip -9) > initramfs.cpio.gz
      - name: Boot isolated QEMU guest and verify KASAN
        run: |
          set +e
          timeout 240s qemu-system-aarch64 -M virt -cpu cortex-a57 -m 3072 -smp 2 -nodefaults -nic none -display none -monitor none -serial stdio -no-reboot -kernel linux/arch/arm64/boot/Image -initrd initramfs.cpio.gz -append 'console=ttyAMA0 rdinit=/init panic=-1' > qemu-console.log 2>&1
          code=$?
          set -e
          tail -n 90 qemu-console.log
          grep -q 'REACH20A_GUEST_STARTED' qemu-console.log
          grep -q 'REACH20A_KASAN_CONFIG_PASS' qemu-console.log
          echo "QEMU exit code: $code"
          echo 'PASS: ARM64 reference kernel booted with KASAN configured'
      - name: Upload VM boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reach20a-qemu-kasan-evidence
          path: |
            qemu-console.log
            linux/.config
          if-no-files-found: warn
